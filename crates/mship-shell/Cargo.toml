[package]
name = "mship-shell"
description = "mothershipOS shell: the host's touch UI (GTK 4 + libadwaita)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mship-core.workspace = true
serde.workspace = true
serde_json.workspace = true
libc.workspace = true
gtk = { package = "gtk4", version = "0.10", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.8", features = ["v1_6"] }
