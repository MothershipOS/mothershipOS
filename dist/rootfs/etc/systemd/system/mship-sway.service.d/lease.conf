[Service]
# patched sway with the lease_output command (patches/0001-sway-lease_output-command.patch) on mothershipOS's
# wlroots (build-wlroots.sh: a leased CRTC stays with its lessee, so the panel and the USB-C display can be leased
# to two VMs at once)
Environment=LD_LIBRARY_PATH=/usr/local/lib/mothership-wlroots
ExecStart=
ExecStart=/usr/local/bin/sway-mship
