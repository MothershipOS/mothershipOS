# mothershipOS: Wi-Fi power save off. The phone is reached over Wi-Fi (ssh) and serves VMs; with power save the
# link stalled for seconds (pings of 0.5-1.5 s, ssh timeouts). Named zz-: NetworkManager reads conf.d in name
# order and the last file wins, so this overrides Ubuntu's default-wifi-powersave-on.conf.
[connection]
wifi.powersave = 2
