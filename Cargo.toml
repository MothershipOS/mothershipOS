[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "2026.1.0"	# mothershipOS release 2026.1 (VERSION)
edition = "2024"
license = "MIT"
repository = "https://github.com/MothershipOS/mothershipOS"

[workspace.dependencies]
mship-core = { path = "crates/mship-core" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
libc = "0.2"
log = "0.4"

[profile.release]
lto = "thin"
strip = "debuginfo"
